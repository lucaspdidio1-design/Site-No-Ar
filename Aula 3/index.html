<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao CSS</title>
    <link rel="stylesheet" href="style.css">

    <!-- Estilização intern: utilizar a tag style -->
 <style>
    body{
        background: lightgreen;
    }
 </style>
<!-- Estilização inline: utilizar o atributo style -->
<body style="background-color: lightcyan;">
    
    <h1 style="text-align: center;">Introdução ao CSS</h1>
    <hr>
<h2>Formas de uso</h2>
<ul>
<li>Inline</li>
<li>Interna</li>
<li>Externa</li>
</ul>

<h2>Seletores CSS</h2>

<ul>
    <li>Tag</li>
    <li id="especial">id</li>
    <li class="bordas">class</li>
</ul>


</body>
</html>
