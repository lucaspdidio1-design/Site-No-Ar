<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Viaje Bem</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"> Viaje Bem</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Início</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button"
                 data-bs-toggle="dropdown" aria-expanded="false">
                Destinos
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="destinos.html#nacionais">Nacionais</a></li>
                <li><a class="dropdown-item" href="destinos.html#internacionais">Internacionais</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="destinos.html#promocoes">Promoções</a></li>
              </ul>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="contato.html">Contato</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow-1 pt-5 mt-4">
    <section class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <h1 class="mb-3">Fale com a nossa equipe</h1>
          <p class="lead mb-4">
            Preencha o formulário para receber um orçamento personalizado.
          </p>

          <form class="card shadow-sm p-4">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome completo</label>
              <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" placeholder="seuemail@email.com" required>
            </div>

            <div class="mb-3">
              <label for="destino" class="form-label">Destino de interesse</label>
              <select class="form-select" id="destino" required>
                <option value="">Selecione um destino</option>
                <option>Gramado</option>
                <option>Rio de Janeiro</option>
                <option>Porto de Galinhas</option>
                <option>Paris</option>
                <option>Roma</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="mensagem" class="form-label">Mensagem</label>
              <textarea class="form-control" id="mensagem" rows="4"
                        placeholder="Conte quantas pessoas vão viajar e as datas desejadas."></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar solicitação</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 Viaje Bem — Agência de Viagens.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
